name: kosing-e2e

services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3003
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  express:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_USER: bank_test
      DB_PASSWORD: local_test_password
      DB_NAME: bank_test
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_test_root_password
      MYSQL_DATABASE: bank_test
      MYSQL_USER: bank_test
      MYSQL_PASSWORD: local_test_password
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1 FROM sessions LIMIT 0'"]
      interval: 3s
      timeout: 5s
      retries: 30
